# CI: `make check` on Ubuntu (three Pythons) and on macOS.
#
# On Ubuntu the first steps are `make check` split into its parts (lint, type, test, sim,
# sim-profiles, estimate, badge, package), so CI and the merge gate on a laptop run the same
# commands. Then the extras: coverage floors, verify-life and the rehearsal tools on simulated
# lives, the cost model on the measured Pi 4 costs, and the Pi gate tools' dry runs (smoke and
# lives, the boot check, collecting the service's lives, the fault matrix).
#
# Nothing here needs a model file, llama.cpp or the Pi: `make test` runs every test under
# tests/ except those marked `pi` (tests/pi) or `model` (tests/templates), which pyproject's
# addopts deselect; the runner has neither, so a test that needed one would fail here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the laptop, 3.13 the Pi; 3.11 is the floor in pyproject.
        python: ["3.11", "3.12", "3.13"]
    env:
      SDL_VIDEODRIVER: dummy        # pygame renders offscreen
      SDL_AUDIODRIVER: dummy
      PYTHONPATH: ${{ github.workspace }}/src   # test this checkout's src, as the Makefile does
      PY: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System packages (OCR for display test D13)
        timeout-minutes: 8
        run: |
          # A stalled Ubuntu mirror once hung this step for the whole job; bound it and retry once.
          for attempt in 1 2; do
            timeout 180 sudo apt-get update -q \
              && timeout 180 sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-eng \
              && break
            echo "::warning::apt attempt $attempt failed; retrying"
          done
          tesseract --version | head -1

      - name: Virtual environment
        run: make venv

      # --- make check, step by step -------------------------------------------------------
      - name: Lint (ruff)
        run: make lint

      - name: Types (pyright)
        run: make type

      - name: Tests with coverage
        run: make test

      - name: Simulated 30-minute lives (under 90 s)
        run: timeout 90 make sim

      - name: One simulated life of every other profile
        run: make sim-profiles

      - name: Thought-count rule on every profile
        run: make estimate

      - name: Small chips (both ports through whole simulated lives)
        run: make badge

      - name: The wheel, installed and run outside the repository
        run: make package

      # --- extras -------------------------------------------------------------------------
      - name: Coverage floors (80% overall; 90% on the strict modules and verify.py)
        run: |
          $PY -m coverage report --fail-under=80 > /dev/null
          for f in src/epitaph/mind/*.py src/epitaph/{clock,pacing,state,events,controller,costmodel,verify}.py; do
            [ -f "$f" ] || continue
            case "$f" in */__init__.py) continue ;; esac
            $PY -m coverage report --fail-under=90 --include="$f" > /dev/null \
              || { echo "::error file=$f::coverage under 90%"; $PY -m coverage report --include="$f"; exit 1; }
          done

      - name: Thought-count rule on the sim profile
        run: $PY -m epitaph estimate --profile sim --hardware pi4-4gb

      - name: verify-life on simulated lives
        run: |
          mkdir -p ci-lives
          for p in smoke-300 skeleton-1200; do
            $PY -m epitaph sim --profile pi4/$p --hardware pi4-4gb --lives 2 --events > ci-lives/$p.jsonl
            $PY -m epitaph.verify ci-lives/$p.jsonl --profile pi4/$p --hardware pi4-4gb --out ci-lives/$p.verify.json
          done
          # The installation (ADR-024) at level full: the first of two lives, so next_birth is judged.
          $PY -m epitaph sim --profile pi4/default --hardware pi4-4gb --lives 2 --events > ci-lives/default.jsonl
          $PY -m epitaph.verify ci-lives/default.jsonl --life 1 --profile pi4/default --hardware pi4-4gb \
            --level full --out ci-lives/default.verify.json

      - name: Rehearsal tools on simulated lives (summary line, compare table)
        run: |
          for p in smoke-300 skeleton-1200; do
            # The fake backend's words fail the 5.11 metrics (exit 1); only exit 2 is an error.
            rc=0
            $PY -m epitaph.verify ci-lives/$p.jsonl --life 1 --profile pi4/$p --hardware pi4-4gb \
              --level rehearsal --summary --no-write >> ci-lives/summaries.jsonl || rc=$?
            [ $rc -le 1 ] || exit $rc
            $PY -m epitaph.verify compare ci-lives/$p.jsonl --profile pi4/$p --hardware pi4-4gb \
              --level screen --require-models 0 --out ci-lives/$p.compare.md > /dev/null
          done
          $PY -c 'import json,sys; [json.loads(l) for l in open(sys.argv[1])]' ci-lives/summaries.jsonl

      - name: Thought-count rule on measured Pi 4 costs, every model (informational; gate G0.4)
        continue-on-error: true
        run: |
          rc=0
          for b in bench bench/measured; do
            ls $b/pi4-*.json > /dev/null 2>&1 || continue
            echo "costs from $b"
            $PY .github/scripts/estimate_measured.py --bench $b \
              || { rc=1; echo "::warning::a Pi 4 profile fails the thought-count rule on $b costs"; }
          done
          exit $rc

      - name: Pi gate tools (shellcheck and dry runs; nothing reaches a Pi)
        run: |
          # make test already runs them against a fake Pi (tests/unit/test_pi_tools.py).
          shellcheck -x tools/smoke_pi.sh tools/headless_boot_check.sh tools/collect_lives.sh \
            tools/fault_matrix_pi.sh tools/soak_sample.sh
          export PI_HOST=pi EPITAPH_SSH=false EPITAPH_PYTHON=$PY
          tools/smoke_pi.sh --dry-run
          tools/smoke_pi.sh --dry-run --profile pi4/skeleton-1200 --lives 2
          tools/smoke_pi.sh --dry-run --profile pi4/default --lives 3
          tools/headless_boot_check.sh --dry-run --reboot
          tools/collect_lives.sh --dry-run --profile pi4/default --lives 3
          tools/fault_matrix_pi.sh --list
          tools/fault_matrix_pi.sh --dry-run

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-py${{ matrix.python }}
          path: |
            .coverage
            ci-lives/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # The same merge gate on macOS: the simulator, the cost model, the small-chip ports and the
  # wheel need nothing of Linux. Tests of the Pi's own tools skip where a tool is missing.
  macos:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Virtual environment
        run: make venv

      - name: make check
        run: make -k check
