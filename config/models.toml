# Candidate models (BUILD_PLAN Appendix A). Ladders are per hardware class; step 0 is the
# healthiest precision. sha256 values are pinned in config/models.lock.toml by
# tools/download_models.py (agent A). `sources` overrides the repo for one quant when the
# default repo lacks it (bartowski ships no Q2_K for Llama 3.2).
llamacpp_tag = "b11277"

[models."llama-3.2-3b-instruct"]
source = "bartowski/Llama-3.2-3B-Instruct-GGUF"
file = "Llama-3.2-3B-Instruct-{quant}.gguf"
sources = { Q2_K = "unsloth/Llama-3.2-3B-Instruct-GGUF", Q3_K_M = "unsloth/Llama-3.2-3B-Instruct-GGUF" }
license = "Llama 3.2 Community License"
ladder.pi4 = ["Q6_K", "Q4_K_M", "Q2_K"]
ladder.pi5 = ["Q6_K", "Q4_K_M", "Q3_K_M", "Q2_K"]
ladder.dev = ["Q6_K", "Q4_K_M", "Q2_K"]

