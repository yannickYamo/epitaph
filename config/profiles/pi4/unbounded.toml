# Homage to Latent Reflection (BUILD_PLAN 5.3): never forgets; dies when the context is
# full (cause=full). Ladder step 1 because step 0 plus a large KV cache does not fit in
# 4 GB. ctx is sized from spike S1a's free RAM; the deadline is only a safety net.
lifespan = "90:00"
death = "none"
unbounded = true
ctx = 5120
verify_level = "full"

[[keyframe]]
at = "0:00"
phase = "unbounded"
health = "nominal"
recall = 1000000
step = 1
threads = 3
cpu_share = 3.0
temperature = 0.8
min_p = 0.06
max_tokens = 80
pause_s = 3
persona_groups = 5
mechanics = true
readings = "full"
letter_ms = 165
jitter = 0.10
hesitation = 0.0
