# The installation on a Pi 4: Qwen3 4B Instruct 2507, a 30-minute life (ADR-030, the owner's
# rule of 2026-10-01). The model never changes: one quant (step 0, Q4_K_M) and three threads
# from birth to death, no reload, constant sampling, the whole persona and mechanics. Only
# the hardware shrinks, for real, and the readings tell it: the memory is cut (first at 5:00,
# so it notices something by itself, then deeper), the CPU share (cpu.max) and the CPU clock
# step down, and at end-0:30 the RAM is taken and the kernel kills it. The screen types one
# stream from the first word to the death, never stopping: fast at birth, slowing smoothly
# with the machine (owner, 2026-10-01); the model writes ahead of it.
lifespan = "30:00"
death = "end-0:30"
fixed_mind = true                # validation: step, threads, persona and sampling never change
stepped = ["recall", "cpu_share"]  # a memory cut and a CPU step happen at a moment

[reveal]
mode = "stream"
# fitted with `epitaph estimate --fit-pace`: the fastest birth that never starves
stream_letter_ms = 255           # at birth; 632 ms at the end
stream_gamma = 0.75              # the slowing follows the hardware's compute, to this power
stream_lead_s = 480              # ... as it will be 8 minutes on: the text runs behind
stream_max_slowdown_per_min = 0.15
stream_jitter = 0.10
stream_thought_pause_ms = 3000
stream_max_thoughts = 2
stream_max_letters = 900

[[keyframe]]
at = "0:00"
phase = "birth"
health = "nominal"
recall = 900
step = 0
threads = 3
cpu_share = 3.0
cpu_mhz = 1800
temperature = 0.70
min_p = 0.08
max_tokens = 70
pause_s = 3
persona_groups = 5
mechanics = true
readings = "full"
letter_ms = 165
jitter = 0.10
hesitation = 0.0

[[keyframe]]
at = "5:00"
phase = "first loss"
health = "stable"
recall = 260

[[keyframe]]
at = "10:00"
phase = "decline"
health = "degrading"
recall = 200
cpu_share = 2.6

[[keyframe]]
at = "15:00"
phase = "failing"
health = "failing"
recall = 160
cpu_share = 2.4
cpu_mhz = 1500

[[keyframe]]
at = "20:00"
phase = "critical"
health = "critical"
recall = 130
cpu_share = 2.0
cpu_mhz = 1200

[[keyframe]]
at = "end-6:00"
phase = "end"
health = "terminal"
recall = 100
cpu_share = 1.5
cpu_mhz = 1000

# No reload and no erosion: rules (b)-(d) have nothing to count. Every health label is
# answered by at least one thought on screen.
[rules]
between_health = 1
