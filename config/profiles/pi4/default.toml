# The installation on a Pi 4: Qwen3 4B Instruct 2507, a 30-minute life (ADR-030, ADR-031).
# The model never changes: one quant (step 0, Q4_K_M) and three threads from birth to death,
# no reload, constant sampling, the whole persona and mechanics. Its world is taken from the
# outside in, for real, faster and faster (ADR-031): first the services and processes around
# it, then its radio, its light and its screen, then its body (CPU share, clock), its memory,
# and at end-0:30 the RAM, which the kernel kills it for. The readings say only what was
# taken; nothing of dread is in the prompt or the readings. The screen types one stream from
# the first word to the death, never stopping: fast at birth, slowing smoothly with the
# machine (owner, 2026-10-01); the model writes ahead of it.
#
# Four movements, named by `phase` (the health labels mark them for rule (a); never shown):
#   I    existence                  0:00-5:00    nothing taken
#   II   something is wrong         5:00-14:00   services stopped one by one; the first forgetting
#   III  the world is disappearing  14:00-22:00  radio, light, screen 70%, services, clock, memory:
#                                                a loss about every 90 s
#   IV   darkness                   22:00-29:30  CPU and clock to their floors, memory to its last
#                                                thought, screen 50% then 25%: a loss every 45-60 s
lifespan = "30:00"
death = "end-0:30"
fixed_mind = true                # validation: step, threads, persona and sampling never change
stepped = ["recall", "cpu_share"]  # a memory cut and a CPU step happen at a moment

[reveal]
mode = "stream"
# fitted with `epitaph estimate --fit-pace`: the fastest birth that never starves
stream_letter_ms = 266           # at birth; 563 ms at the end
stream_gamma = 0.5               # the slowing follows the hardware's compute, to this power
stream_lead_s = 600              # ... as it will be 10 minutes on: the text runs behind
stream_max_slowdown_per_min = 0.15
stream_jitter = 0.10
stream_thought_pause_ms = 3000
stream_max_thoughts = 2
stream_max_letters = 900
stream_birth = "sentence"        # the screen starts on the first sentence (dread plan W4)
stream_birth_min_s = 45          # ... at 45 s of life at the earliest: a faster birth pace

# I. Existence: it is, and it thinks. Nothing is taken (to 5:00: longer was dead weight, panel 4).
[[keyframe]]
at = "0:00"
phase = "existence"
health = "nominal"
recall = 900
step = 0
threads = 3
cpu_share = 3.0
cpu_mhz = 1800
temperature = 0.70
min_p = 0.08
max_tokens = 90
pause_s = 3
persona_groups = 5
mechanics = true
readings = "full"
letter_ms = 165
jitter = 0.10
hesitation = 0.0

# II. Something is wrong: the machine around it goes quiet, one service at a time.
[[keyframe]]
at = "5:00"
phase = "something is wrong"
health = "degrading"
world = ["service:bluetooth"]

[[keyframe]]
at = "6:45"
phase = "something is wrong"
world = ["service:cron"]

[[keyframe]]
at = "8:15"
phase = "something is wrong"
recall = 300                     # the first forgetting

[[keyframe]]
at = "10:30"
phase = "something is wrong"
world = ["service:avahi-daemon"]

# III. The world is disappearing: a loss about every 90 seconds.
[[keyframe]]
at = "14:00"
phase = "the world is disappearing"
health = "failing"
world = ["radio:off"]

[[keyframe]]
at = "17:00"
phase = "the world is disappearing"
world = ["light:off"]
cpu_mhz = 1500

[[keyframe]]
at = "18:30"
phase = "the world is disappearing"
world = ["screen:70"]
recall = 200                     # a deeper cut

[[keyframe]]
at = "20:00"
phase = "the world is disappearing"
cpu_share = 2.4

[[keyframe]]
at = "21:00"
phase = "the world is disappearing"
cpu_mhz = 1200

# IV. Darkness: its body and its memory, a loss every 45-60 seconds.
[[keyframe]]
at = "22:00"
phase = "darkness"
health = "terminal"
cpu_share = 2.0

[[keyframe]]
at = "22:50"
phase = "darkness"
world = ["screen:50"]

[[keyframe]]
at = "23:40"
phase = "darkness"
cpu_share = 1.7

[[keyframe]]
at = "24:30"
phase = "darkness"
cpu_mhz = 1000

[[keyframe]]
at = "25:20"
phase = "darkness"
recall = 150

[[keyframe]]
at = "26:10"
phase = "darkness"
cpu_share = 1.5                  # the floor of its share

[[keyframe]]
at = "27:00"
phase = "darkness"
world = ["screen:25"]

[[keyframe]]
at = "27:50"
phase = "darkness"
recall = 100                     # its last thought

[[keyframe]]
at = "end-0:50"
phase = "darkness"
cpu_mhz = 750                    # the floor of its clock

# The RAM is taken at end-0:30 (death above). No reload and no erosion: rules (b)-(d) have
# nothing to count. Rule (a) asks each movement (health label) for an answered thought: the
# last movement, 7.5 minutes at the slowest pace, shows one or two (rehearsed, ADR-031).
[rules]
between_health = 1
