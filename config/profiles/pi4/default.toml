# The installation on a Pi 4: Qwen3 4B Instruct 2507, chosen at checkpoint A (BUILD_PLAN 5.3; decisions ADR-014, F6).
# The 4B writes about one token a second, so each thought takes about 90 s: the losses are spaced
# for that, thoughts are shorter, and the memory is carried across reloads (slot hand-over, set
# in `[backend] reload_handover`). The CPU share drops only a little at each reload, just enough
# that speed never rises after a loss (ADR-010); the steep slowdown comes during erosion.
lifespan = "60:00"
death = "end-0:30"

[[keyframe]]
at = "0:00"
phase = "birth"
health = "nominal"
recall = 1000
step = 0
threads = 3
cpu_share = 3.0
temperature = 0.70
min_p = 0.08
max_tokens = 80
pause_s = 3
persona_groups = 5
mechanics = true
readings = "full"
letter_ms = 165
jitter = 0.10
hesitation = 0.0

