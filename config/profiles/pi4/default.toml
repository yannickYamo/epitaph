# The installation on a Pi 4 (BUILD_PLAN 5.3), rebased on measured Qwen3 1.7B costs in phase
# 0c (docs/PROFILES.md: every change, and the estimate before and after). Times: "mm:ss"
# scales with --lifespan; "end-mm:ss" is anchored to the end of life. Omitted fields hold the
# previous value.
# Stepped: phase, health, step, threads, persona_groups, mechanics, readings.
lifespan = "60:00"
death = "end-0:30"               # the death squeeze (death_mode = oom)

[[keyframe]]
at = "0:00"
phase = "birth"
health = "nominal"
recall = 1280
step = 0
threads = 3
cpu_share = 3.0
temperature = 0.70
min_p = 0.08
max_tokens = 80
pause_s = 3
persona_groups = 5
mechanics = true
readings = "full"
letter_ms = 165
jitter = 0.10
hesitation = 0.0

[[keyframe]]
at = "12:00"
phase = "prime"
health = "stable"
temperature = 0.75

[[keyframe]]
at = "22:00"
phase = "loosening"
recall = 1000
temperature = 0.80

[[keyframe]]
at = "28:00"
phase = "first loss"
health = "degrading"
recall = 240                     # the re-read at share 2.0 fits the 180 s silence (S4)
step = 1
cpu_share = 2.0                  # review 2, F2: Q4_K_M at 2.0 cores is no faster than Q8_0 at 3
temperature = 0.85
min_p = 0.06
max_tokens = 70
pause_s = 4
letter_ms = 180
jitter = 0.15
hesitation = 0.02

[[keyframe]]
at = "36:00"
phase = "decline"
health = "failing"
recall = 210
temperature = 1.00
max_tokens = 60
pause_s = 5
letter_ms = 210
jitter = 0.20
hesitation = 0.05

[[keyframe]]
at = "end-17:00"
phase = "failing"
health = "critical"
recall = 120                     # keeps the reload-2 silence under 180 s at share 1.5
step = 2
threads = 2                      # the thread drop comes with reload 2 (see docs/PROFILES.md)
cpu_share = 1.5                  # F2: Q2_K at 1.5 cores is no faster than Q4_K_M at 2.0
temperature = 1.15
min_p = 0.04
max_tokens = 45
pause_s = 6
readings = "short"
letter_ms = 270
jitter = 0.25
hesitation = 0.08

[[keyframe]]
at = "end-11:00"
phase = "eroding"
recall = 110
cpu_share = 1.4
temperature = 1.25
max_tokens = 35
pause_s = 7
persona_groups = 4

[[keyframe]]
at = "end-9:00"
health = "terminal"
recall = 100
cpu_share = 1.1
temperature = 1.35
max_tokens = 28
pause_s = 8
persona_groups = 3
letter_ms = 360
jitter = 0.30
hesitation = 0.12

[[keyframe]]
