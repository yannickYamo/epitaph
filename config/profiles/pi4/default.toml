# The installation on a Pi 4: Qwen3 4B Instruct 2507, a 30-minute life (owner decision,
# 2026-09-30). Both reloads stay; erosion takes the persona in three steps, the knowledge of its
# death last; the CPU clock falls from 1800 to 600 MHz (spike S7: speed is linear in the clock).
lifespan = "30:00"
death = "end-0:30"

[[keyframe]]
at = "0:00"
phase = "birth"
health = "nominal"
recall = 900
step = 0
threads = 3
cpu_share = 3.0
temperature = 0.70
min_p = 0.08
max_tokens = 55
pause_s = 3
persona_groups = 5
mechanics = true
readings = "full"
letter_ms = 165
jitter = 0.10
hesitation = 0.0

[[keyframe]]
at = "5:00"
phase = "prime"
temperature = 0.75

[[keyframe]]
at = "8:00"
phase = "first loss"
health = "degrading"
recall = 220
step = 1
threads = 3
cpu_share = 2.6
temperature = 0.85
min_p = 0.06
max_tokens = 48
pause_s = 4
letter_ms = 180
jitter = 0.15
hesitation = 0.02

[[keyframe]]
at = "14:00"
phase = "failing"
health = "critical"
