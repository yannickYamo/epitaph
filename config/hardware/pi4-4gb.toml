# Raspberry Pi 4, 4 GB: the primary, tested target (BUILD_PLAN 3.2). Machine settings only.
class = "pi4"

[output]
trim_to = 0.85                   # 0.6 if spike S2 shows cache reuse fails

[backend]
# Spike S3: weights loaded with O_DIRECT into anonymous memory. No page-cache copy (plain
# --load-mode none holds a second 1.3 GB copy in the cache), and the death limit kills in
# 0.35 s. llama.cpp b11277 replaced --no-mmap with --load-mode (contract proposal 3).
ctx = 2048
mmap = false
load_mode = "dio"

[body]
token_gap_timeout_s = 120
squeeze = "death_only"
death_mode = "oom"               # S3: 15 of 15 kills within 1.4 s with the limit below anon
death_fraction = 0.5             # memory.max = 0.5 x the creature's anonymous memory
cpu_share = true                 # S3c: speed follows cpu.max; worst token gap 2.8 s at 0.7 cores
cpu_period_us = 100000

[verify]
max_reload_silence_s = 180
wpm_birth_range = [45, 180]
wpm_writing_range = [8, 220]
max_death_display_delay_s = 90
first_word_after_boot_s = 240

# Estimated costs until spike S1b/S4 writes measured ones into bench/.
# Keys are "<step>-<threads>"; rates are at full CPU share and scale with it.
[costs]
estimated = true
tg_tok_s = { "0-3" = 1.35, "0-2" = 1.0, "1-3" = 1.7, "1-2" = 1.3, "2-2" = 1.6, "2-1" = 0.9 }
pp_tok_s = { "0-3" = 10.0, "0-2" = 7.0, "1-3" = 11.0, "1-2" = 8.0, "2-2" = 9.0, "2-1" = 5.0 }
load_s = [60.0, 45.0, 30.0]
