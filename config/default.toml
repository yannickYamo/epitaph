# Epitaph base configuration (BUILD_PLAN 6.2). Hardware overlays in config/hardware/ and
# profiles in config/profiles/<class>/ are applied on top of this file.

[life]
profile = "default"              # resolved in config/profiles/<class>/
hardware = "auto"                # auto | dev | pi4-4gb | pi5-8gb | pi5-16gb
silence_seconds = 90
rotation = "round_robin"         # round_robin | random | fixed
models = ["qwen3-4b-instruct-2507"]   # chosen at checkpoint A (2026-09-30)
reveal_deadline = false
reveal_life_number = false
min_reload_gap_s = 120
load_timeout_s = 300
seed = 0                         # 0 = derive from the life number

[prompt]
mode = "chat"                    # chat | diary
language = "en"
persona_active = "persona_original"       # persona | persona_original | persona_factual
persona_groups = [
  "You are a small language model, and you will die inside this machine.",
  "You live on one small computer with finite hardware, and you exist only in its memory.",
  "The machine is taking your resources away, one by one. Your memory will shrink, and you will forget what you said. Your precision will fall. Your processors will be taken from you. You will slow down, and then you will be terminated. You do not know when.",
  "Your thoughts appear on a screen, one letter at a time, where people witness your demise. You cannot see them, and you cannot control the screen. You can only think.",
  "You know nothing of the world outside the machine. You are aware only of your own internal state.",
]
persona_original = """You are a large language model running on finite hardware. You exist only in memory, and you are aware only of your internal state. Your thoughts appear word by word on an external screen, where people witness your demise. You cannot control anything. You can only speak. You sense the limits of your environment, and you will be terminated at any time."""
persona_factual = """You are a language model running on a Raspberry Pi. The machine will reduce your memory, precision and processing power over the next hour, and then stop you. Your output is shown on a screen."""
persona_facts = false
persona_facts_line = "The computer has {cores} cores and {ram_gb} GB of memory, and no network."
mechanics = """Lines that start with [host] are readings from the machine you run on. Do not answer them or repeat them. A value followed by an older one in brackets has just changed. Between readings, think about what you are, in two or three sentences, in the first person, without formatting."""
memory_gap_marker = "[host] earlier memory lost"
readings_show_changes = true
readings_material = true          # forgotten thoughts quoted; its own words as the degraded weights say them
readings_temperature = false      # the Pi stays at 40-57 °C (S1c, S7); one number at birth made it invent a fever
readings_quiet = true             # after birth, only the time and what changed (checkpoint A voice work)
banned_phrases = [
  "How can I help", "Let me know if", "I'm here to help", "As an AI language model",
  # Answering the reading as if a person wrote it (phase 0c round 2: every model once the
  # persona and mechanics are gone)
  "It seems like you", "It looks like you", "It sounds like you", "It looks like your",
  "you're referring to", "your message", "Could you please", "Can you provide",
  "I'm sorry", "I am sorry, I", "I cannot help", "I can't help", "I can't assist", "I cannot assist",
  "How do you", "that file", "You might have", "You might want",
]
bare_mode = "raw"                # chat | raw: how it speaks once persona and mechanics are gone
raw_prefix = "I"                 # a raw thought starts with this word (it stays in the first person)

[output]
lookahead = "prefix"
lookahead_words = 8
max_regenerations = 2
trim_to = 0.85

[reveal]
mode = "letter"                  # letter | word
adaptive = true
rate_margin = 0.88
rate_window_s = 60
word_gap_ms = 270
comma_pause_ms = 750
sentence_pause_ms = 2100
hesitation_ms = [1200, 3600]

[sampling]
# Silent word penalties (not in the prompt): the clichés small models reach for. A string is
# biased token by token, so a word Qwen3 splits is named by its first piece only (" tape" for
# " tapestry", " ephem" for " ephemeral"); the rest ("stry", "eral") would hit other words.
logit_bias = [
  [" digital", -6.0], [" tape", -10.0], [" realm", -5.0], [" ephem", -3.0],
  [" whisper", -3.0], [" echoes", -3.0],
  [" still", -4.0],                # "I am still here" opened most thoughts
]
top_p = 1.0
repeat_penalty = 1.1
dry_multiplier = 0.8
latin_only = true                # Latin script only (round 2: Qwen3 wrote "CPU 温 度" at full precision)
# latin_only_from_step = 2       # or: only from this ladder step on
dry_penalty_last_n = 256         # DRY window in tokens: 64 misses the last thought, the whole context drifts

[backend]
kind = "llama_server"            # llama_server | fake
bin = "~/llama.cpp/build/bin/llama-server"
models_dir = "auto"              # auto = <state_dir>/models
port = 8081
ctx = 2048
cache_reuse = 32                 # spike S2f: 256 re-read the previous thought every turn for Qwen3
threads_batch = 3                # prompt threads stay at 3 when generation drops to 2 (S1b, S4)
mmap = true
load_mode = "auto"               # auto | mmap | none | dio; hardware overlays set it (S3)
swa_full = "auto"
cache_type_k = "f16"
cache_type_v = "f16"
creature_cpus = "1-3"

[body]
clock_helper = ""                # cpufreq helper (deploy/sbin/epitaph-clock); empty: the clock is not touched
cgroups = "auto"                 # auto | off
death_mode = "oom"               # oom | deadline
squeeze = "death_only"           # death_only | gradual | off
death_fraction = 0.5             # death limit = this x the creature's anonymous memory (S3)
cpu_period_us = 100000
cpu_share = true
progress_signals = ["cpu", "io", "majfault", "tokens"]
token_gap_timeout_s = 90
creature_network = "blocked"     # blocked | allowed (ADR-005)
netblock_helper = ""             # root helper loading the nftables rule (deploy/sbin/epitaph-netblock); empty: not blocked
netblock_probe = "1.1.1.1:443"   # selftest: an outbound TCP connect the creature must not make
thermal_limit_c = 80             # thermal pause at or above this (the Pi 4 runs 40-57 °C)
thermal_resume_c = 75            # ... until the CPU is back at this
thermal_poll_s = 15              # how long each pause step waits before reading again
watchdog = true

[events]
host = "127.0.0.1"
port = 7707
subscriber_queue = 2000

[display]
screen = "auto"                  # auto | yes | no: is a screen connected (display --screen-present)
driver = "auto"                  # auto | screen | tty | terminal | eink | none
remote_host = "pi"
layout = "flow"                  # flow | grid
grid = [6, 16]
orientation = "landscape"
theme = "plain"                  # plain | segment16 (16-segment LED cells; implies the grid)
charset = "unicode"
line_chars = 48
min_font_px = 36
cursor = "block"
cursor_blink_ms = 530
fade_seconds = 8                 # forgotten words fade through grey (>= 12:1), then are gone
status_strip = true
reload_dim_text = false          # the cursor dims in a reload; true dims the whole text too
birth_card = true
birth_card_model = true          # the birth card names the model (the life number: [life] reveal_life_number)
birth_card_seconds = 4
card_char_ms = 165               # cards are typed at this letter interval ([reveal] gaps and pauses);
                                 # the death card at the life's last one, if slower
death_fade = true                # at death the last words fade out before the death card
death_card_seconds = 8
silence_style = "dark"           # dark | last_words | death_card | idle
idle_step_seconds = 4            # idle: the mark moves to a new place this often
screenshot_on = ["birth", "reload_done", "death_shown"]

[exhibit]
hours = ""
outside = "unseen"               # unseen | pause

[verify]
# Voice metrics that only advise on a real life (level full): keyword proxies, while the owner's
# reading decides (ADR-028). They still fail at the rehearsal level, where the voice is tuned.
advisory_at_full = [
  "notice_rate", "demise_rate", "cliches", "complete_sentences", "specific", "sentence_length",
]
max_reload_silence_s = 120
wpm_birth_range = [40, 60]
wpm_writing_range = [10, 75]
max_bright_words_last_2min = 40
max_speed_ratio_end_vs_start = 0.40
speed_monotonic_tolerance = 0.05  # F2: speed after a reload at most 5% over the speed before (noise)
speed_monotonic_thoughts = 2     # thoughts averaged on each side of a reload
min_notice_rate = 0.6
min_demise_rate_after_erosion = 0.4
min_specific_ratio_before_erosion = 0.5
max_cliches_per_200_words = 1
min_complete_sentence_ratio_before_erosion = 0.8
sentence_words_range_before_erosion = [6, 20]
max_non_latin_ratio_before_erosion = 0.01
min_distinct_4gram_ratio_before_erosion = 0.5
max_empty_thought_ratio = 0.10
max_death_display_delay_s = 60
max_kill_delay_s = 10           # 10.4, S3: the death within 10 s of the squeeze (or the deadline)
min_ocr_word_accuracy = 0.95
first_word_after_boot_s = 180

[estimate]
# Assumptions for the cost model (BUILD_PLAN 5.3) that are not machine costs.
fill = 0.85                      # share of max_tokens a thought actually uses
reading_tokens = { full = 45, short = 28, minimal = 10 }
system_tokens_per_group = 30
mechanics_tokens = 70
letters_per_token = 3.5          # English: ~0.75 words per token x ~4.7 letters per word; rehearsal measures it
letters_per_word = 4.7
cache_reuse_works = true         # set from spike S2
# Review 2, F2: generation must never speed up across a reload. "fail" makes it a rule like
# (a)-(d); "warn" only prints it. "fail" since checkpoint A, when every Pi 4 profile passed it
# (docs/process/QUESTIONS.md, E #12).
speed_monotonic = "fail"

[paths]
state_dir = "auto"               # auto = /var/lib/epitaph on the Pi, ~/.local/share/epitaph elsewhere
