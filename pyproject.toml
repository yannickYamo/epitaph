[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epitaph"
version = "0.1.0"
description = "A small language model lives and dies on a Raspberry Pi, one hour at a time."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
display = ["pygame>=2.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380", "pillow>=10", "pytesseract>=0.3"]

[project.scripts]
epitaph = "epitaph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "pi: needs the real Pi (run through tools/pi_lock.sh)",
  "model: needs a real llama-server and model file (laptop lock)",
  "display: renders with pygame (offscreen)",
]
addopts = "-m 'not pi and not model'"

[tool.coverage.run]
source = ["src/epitaph"]
omit = ["src/epitaph/display/screen.py", "src/epitaph/afterlife/*", "src/epitaph/senses/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
strict = [
  "src/epitaph/mind",
  "src/epitaph/clock.py",
  "src/epitaph/pacing.py",
  "src/epitaph/state.py",
  "src/epitaph/events.py",
  "src/epitaph/controller.py",
  "src/epitaph/costmodel.py",
]
venvPath = "."
venv = ".venv"
