[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epitaph"
version = "0.1.0"
description = "A small language model lives and dies on a Raspberry Pi, one hour at a time."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Yannick" }]
keywords = ["raspberry-pi", "llm", "llama.cpp", "art", "installation", "generative-art", "cgroups"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Artistic Software",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/yannickYamo/epitaph"
Documentation = "https://github.com/yannickYamo/epitaph/blob/main/docs/BUILD_PLAN.md"
Issues = "https://github.com/yannickYamo/epitaph/issues"

[project.optional-dependencies]
display = ["pygame>=2.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380", "pillow>=10", "pytesseract>=0.3"]

[project.scripts]
epitaph = "epitaph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "pi: needs the real Pi (run through tools/pi_lock.sh)",
  "model: needs a real llama-server and model file (laptop lock)",
  "display: renders with pygame (offscreen)",
]
addopts = "-m 'not pi and not model'"

[tool.coverage.run]
source = ["src/epitaph"]
omit = ["src/epitaph/display/screen.py", "src/epitaph/senses/*"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D1"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Docstrings are required on the public API in src/; tests and one-off tools are exempt.
"tests/**" = ["D1"]
"tools/**" = ["D1", "E501"]  # tables and usage examples read better unwrapped

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
strict = [
  "src/epitaph/mind",
  "src/epitaph/afterlife",
  "src/epitaph/clock.py",
  "src/epitaph/pacing.py",
  "src/epitaph/state.py",
  "src/epitaph/events.py",
  "src/epitaph/controller.py",
  "src/epitaph/exhibit.py",
  "src/epitaph/costmodel.py",
  "src/epitaph/verify.py",
]
venvPath = "."
venv = ".venv"
