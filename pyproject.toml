[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epitaph"
version = "1.1.0"
description = "A language model lives thirty minutes on a Raspberry Pi while the machine takes its hardware away, dies, and is born again."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Yannick" }]
keywords = ["raspberry-pi", "llm", "llama.cpp", "art", "installation", "generative-art", "cgroups"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Artistic Software",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/yannickYamo/epitaph"
Documentation = "https://github.com/yannickYamo/epitaph/blob/main/docs/README.md"
Issues = "https://github.com/yannickYamo/epitaph/issues"

[project.optional-dependencies]
display = ["pygame>=2.5"]
dev = ["build>=1.2", "pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380", "pillow>=10", "pytesseract>=0.3", "numpy>=1.26"]

[project.scripts]
epitaph = "epitaph.cli:main"

# The wheel carries what a life reads at run time: the configuration, the measured costs and
# the fonts live at the top of the repository and are installed as epitaph/_data/
# (config.DATA_ROOT finds them in a checkout or in an installed package).
[tool.setuptools]
packages = [
  "epitaph",
  "epitaph.afterlife",
  "epitaph.backend",
  "epitaph.body",
  "epitaph.display",
  "epitaph.display.themes",
  "epitaph.mind",
  "epitaph._data.config",
  "epitaph._data.bench",
  "epitaph._data.assets",
]

[tool.setuptools.package-dir]
"" = "src"
"epitaph._data.config" = "config"
"epitaph._data.bench" = "bench"
"epitaph._data.assets" = "assets"

[tool.setuptools.package-data]
"epitaph._data.config" = ["*.toml", "*/*.toml", "*/*/*.toml"]
"epitaph._data.bench" = ["*.json", "measured/*.json", "calibration/*.json"]
"epitaph._data.assets" = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "pi: needs the real Pi (run through tools/pi_lock.sh)",
  "model: needs a real llama-server and model file (laptop lock)",
  "display: renders with pygame (offscreen)",
]
addopts = "-m 'not pi and not model'"

[tool.coverage.run]
source = ["src/epitaph"]
omit = ["src/epitaph/display/screen.py"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D1"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Docstrings are required on the public API in src/; tests and one-off tools are exempt.
"tests/**" = ["D1"]
"tools/**" = ["D1", "E501"]  # tables and usage examples read better unwrapped
"badge/tools/**" = ["D1", "E402", "E501"]  # host tools, like tools/**; the engine is imported from the app folder
# MicroPython on the badge: the runtime injects badge, screen, color, font, run; the display
# mode is set before the imports.
"badge/tufty/**" = ["F821", "E402", "D1", "SIM105", "UP031"]  # no contextlib; % is cheapest

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
strict = [
  "src/epitaph/mind",
  "src/epitaph/afterlife",
  "src/epitaph/clock.py",
  "src/epitaph/pacing.py",
  "src/epitaph/state.py",
  "src/epitaph/events.py",
  "src/epitaph/controller.py",
  "src/epitaph/exhibit.py",
  "src/epitaph/costmodel.py",
  "src/epitaph/verify.py",
]
venvPath = "."
venv = ".venv"
